name: Feature request
description: 提议一个新功能或改进
title: "[Feature] "
labels: [ "enhancement" ]
body:
  - type: markdown
    attributes:
      value: |
        提之前请先看一眼 [README 的 Roadmap](../blob/main/README.md#roadmap) 和
        [docs/ROADMAP.md](../blob/main/docs/ROADMAP.md)，可能已经有人在做或者已经明确不做了。

        Kite 的定位是**手机上的通用智能体**，不是：
        - 某个 App 的专用脚本
        - 云端服务（没有服务端，Key 在用户手里）
        - 越狱/破解工具

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我搜索过现有 issue 和 Roadmap，没有重复
          required: true
        - label: 这个功能能在**没有服务端**的前提下实现（或说明了为什么必须要有）
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的是什么问题？
      description: 描述场景，不要直接说方案。例如「我想让它读完一份 50 页的合同并列出风险点，但……」
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望怎么解决
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - Agent 循环 / 提示词
        - 工具（新增或改进）
        - 文件与文档解析
        - MCP
        - 技能（Skills）
        - 定时任务 / 后台
        - 无障碍 / 系统自动化
        - 界面与交互
        - 构建 / 工程
        - 文档
        - 其他
    validations:
      required: true

  - type: dropdown
    id: variant
    attributes:
      label: 主要针对哪个版本
      options:
        - 两个版本都要
        - 仅 Play 版（release）
        - 仅个人版（personal）
    validations:
      required: true

  - type: checkboxes
    id: willing
    attributes:
      label: 你愿意提交 PR 吗
      options:
        - label: 我愿意自己实现并提 PR
        - label: 我可以帮忙测试
